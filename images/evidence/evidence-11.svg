<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap");</style><clipPath id="frame"><rect width="900" height="1200"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="900" height="1200" fill="#e9e4d9"/><text font-family="Kazimir, 'Old Standard TT', Georgia, serif" font-size="230" font-weight="400" fill="#171918" xml:space="preserve"><tspan x="-10.0" y="341.7">ПО-</tspan></text><text font-family="Kazimir, 'Old Standard TT', Georgia, serif" font-size="230" font-weight="400" fill="#171918" xml:space="preserve"><tspan x="-10.0" y="571.7">КА-</tspan></text><text font-family="Kazimir, 'Old Standard TT', Georgia, serif" font-size="230" font-weight="400" fill="#171918" xml:space="preserve"><tspan x="-10.0" y="801.7">ЗА-</tspan></text><text font-family="Kazimir, 'Old Standard TT', Georgia, serif" font-size="230" font-weight="400" fill="#b83235" xml:space="preserve"><tspan x="-10.0" y="1031.7">НИЕ</tspan></text><text font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a5852" xml:space="preserve"><tspan x="600.0" y="1015.6">Заголовок прижат к левому краю.</tspan><tspan x="600.0" y="1036.6">Поле справа оставлено пустым</tspan><tspan x="600.0" y="1057.6">намеренно.</tspan></text><text font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.88" fill="#5a5852" xml:space="preserve"><tspan x="48.0" y="57.5">EVIDENCE 11</tspan></text><text font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.72" fill="#5a5852" xml:space="preserve"><tspan x="48.0" y="1160.5">«Показание у края»</tspan></text></g></svg>